<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Photon social preview</title>
  <desc id="desc">Photon is a Go terminal tool that turns one question into a structured AI summary and key points.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16"/>
      <stop offset="0.58" stop-color="#0b1222"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(286 174) rotate(42) scale(496 410)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee" stop-opacity="0.27"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="164" y1="0" x2="510" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee" stop-opacity="0.1"/>
      <stop offset="0.52" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#a5f3fc" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <clipPath id="terminalClip">
      <rect x="622" y="80" width="578" height="480" rx="22"/>
    </clipPath>
  </defs>

  <rect width="1280" height="640" fill="url(#background)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <g opacity="0.12" stroke="#94a3b8">
    <path d="M0 108H1280M0 214H1280M0 320H1280M0 426H1280M0 532H1280"/>
    <path d="M106 0V640M212 0V640M318 0V640M424 0V640M530 0V640M636 0V640M742 0V640M848 0V640M954 0V640M1060 0V640M1166 0V640"/>
  </g>

  <g transform="translate(80 74)">
    <circle cx="22" cy="20" r="10" fill="#22d3ee"/>
    <path d="M36 20H104" stroke="url(#beam)" stroke-width="4" stroke-linecap="round"/>
    <text x="0" y="112" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="84" font-weight="700" letter-spacing="7">PHOTON</text>
    <text x="0" y="174" fill="#a5f3fc" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600">STRUCTURED AI ANSWERS</text>
    <text x="0" y="208" fill="#a5f3fc" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600">IN YOUR TERMINAL</text>
    <text x="0" y="265" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="26">Ask one question.</text>
    <text x="0" y="304" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="26">Get a concise summary and key points.</text>

    <g transform="translate(0 352)" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1">
      <rect width="104" height="38" rx="19" fill="#0f2532" stroke="#155e75"/>
      <text x="52" y="25" text-anchor="middle" fill="#67e8f9">GO CLI</text>
      <rect x="116" width="140" height="38" rx="19" fill="#0f2532" stroke="#155e75"/>
      <text x="186" y="25" text-anchor="middle" fill="#67e8f9">HOMEBREW</text>
      <rect x="268" width="188" height="38" rx="19" fill="#0f2532" stroke="#155e75"/>
      <text x="362" y="25" text-anchor="middle" fill="#67e8f9">MACOS + LINUX</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="622" y="80" width="578" height="480" rx="22" fill="#070b12" stroke="#263346" stroke-width="2"/>
    <g clip-path="url(#terminalClip)">
      <rect x="622" y="80" width="578" height="52" fill="#111827"/>
      <circle cx="652" cy="106" r="7" fill="#fb7185"/>
      <circle cx="676" cy="106" r="7" fill="#fbbf24"/>
      <circle cx="700" cy="106" r="7" fill="#4ade80"/>
      <text x="911" y="112" text-anchor="middle" fill="#64748b" font-family="Menlo, Monaco, monospace" font-size="14">photon</text>

      <g font-family="Menlo, Monaco, monospace" font-size="16">
        <text x="652" y="172" fill="#22d3ee">$</text>
        <text x="676" y="172" fill="#e2e8f0">ptn "attention is all you need"</text>
        <text x="652" y="218" fill="#67e8f9" font-weight="700">PHOTON RESEARCH RESULTS</text>
        <text x="652" y="262" fill="#fde047" font-weight="700">SUMMARY</text>
        <text x="652" y="290" fill="#cbd5e1">The Transformer replaces recurrence with</text>
        <text x="652" y="315" fill="#cbd5e1">attention for efficient sequence modeling.</text>
        <text x="652" y="359" fill="#4ade80" font-weight="700">KEY POINTS</text>
        <text x="652" y="392" fill="#22d3ee">01</text>
        <text x="688" y="392" fill="#cbd5e1">Self attention connects every token.</text>
        <text x="652" y="426" fill="#22d3ee">02</text>
        <text x="688" y="426" fill="#cbd5e1">No recurrent or convolutional layers.</text>
        <text x="652" y="460" fill="#22d3ee">03</text>
        <text x="688" y="460" fill="#cbd5e1">Parallel training improves efficiency.</text>
        <rect x="652" y="502" width="370" height="1" fill="#263346"/>
        <text x="652" y="532" fill="#64748b" font-size="14">github.com/Jacky040124/photon</text>
      </g>
    </g>
  </g>
</svg>
